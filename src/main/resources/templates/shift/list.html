
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>シフト一覧</title>
	<link rel="stylesheet" th:href="@{/css/app.css}">
	<link rel="stylesheet" th:href="@{/css/shift.css}">
</head>

<body class="shift-page shift-list-page">
	<main class="shift-page__main">

	<!-- ▼ タイトル：monthLabel は null 時フォールバック -->
	<h2 class="shift-page__title"
		th:text="|シフト一覧（${selectedDepartmentName != null ? selectedDepartmentName : '部署未選択'}
		／${monthLabel != null ? monthLabel : '未指定'}）|">
	</h2>


	<form method="get" th:action="@{/shift/list}" class="shift-filter">
		<label>部署:</label>
		<select name="department">
			<option th:each="deptCode : ${departments}" th:value="${deptCode}"
				th:text="${departmentNames[deptCode.toString()]}" th:selected="${deptCode == department}">
			</option>
		</select>

		<label>月:</label>
		<!-- ▼ input type="month" は yyyy-MM（monthValue） -->
		<input type="month" name="month" th:value="${monthValue != null ? monthValue : ''}" />

		<button type="submit" class="shift-button shift-button--primary">表示</button>
	</form>


	<!-- ▼ 追加：凡例 -->
	<div class="legend shift-legend" aria-label="勤務区分の凡例">
		<span class="日">日</span>
		<span class="shift-9-14">9-14</span>
		<span class="shift-14-16">14-16</span>
		<span class="shift-16-18">16-18</span>
		<span class="shift-14-18">14-18</span>
		<span class="夜">夜</span>
		<span class="明">明</span>
		<span class="休">休</span>
		<span class="有">有</span>
		<span class="臨(確)">臨(確)</span>
		<span class="臨(自)">臨(自)</span>
	</div>

	<div class="shift-table-wrap">
	<table class="shift-table shift-table--readonly">
		<thead>
			<tr>
				<th>職員名</th>
				<th th:each="d : ${dates}" th:text="${#temporals.format(d, 'M/d')}"></th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="user : ${users}">
				<td th:text="${user.lastName + ' ' + user.firstName}"></td>

				<!-- ▼ key変数を使わず、直接 user.id + '_' + dateKey で参照 -->
				<td th:each="d : ${dates}" th:with="
                    dateKey=${#temporals.format(d, 'yyyy-MM-dd')},
                    raw=${shiftMap != null ? shiftMap[user.id + '_' + dateKey] : null},
                    val=${raw != null ? #strings.trim(raw) : null},
                    shiftClass=${val == '9-14' ? 'shift-9-14' :
                        (val == '14-16' ? 'shift-14-16' :
                        (val == '16-18' ? 'shift-16-18' :
                        (val == '14-18' ? 'shift-14-18' :
                        (!#strings.isEmpty(val) ? val : ''))))}
                " th:attr="title=${user.id + '_' + dateKey + ' = ' + (val != null ? val : 'null')}"
					th:text="${!#strings.isEmpty(val) ? val : '-'}"
					th:classappend="${shiftClass}">
				</td>
			</tr>
		</tbody>
	</table>
	</div>

	<nav class="shift-page__actions">
		<!-- ▼ リンクの month は yyyy-MM（monthValue）で統一 -->
		<a th:href="@{/shift/generate(department=${department}, month=${monthValue})}">シフト生成画面へ</a>
		<a th:href="@{/shift/edit(department=${department}, month=${monthValue})}">シフト編集画面へ</a>
		<a href="/">ホームへ戻る</a>
	</nav>

	</main>
</body>

</html>
