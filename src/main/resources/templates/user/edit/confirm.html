<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー編集確認</title>

    <!-- 共通デザインとユーザー管理画面のスタイルシート -->
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <link rel="stylesheet" th:href="@{/css/user.css}" href="/css/user.css">
</head>

<body class="app-page">
    <!-- 共通ヘッダーとユーザー一覧への戻りリンク -->
    <header class="app-header">
        <a class="brand brand--dark" th:href="@{/home}" href="/home"
           aria-label="ShiftManager ホーム">
            <span class="brand__mark" aria-hidden="true">S</span>
            <span>ShiftManager</span>
        </a>
        <a class="header-back-link" th:href="@{/user/list}">← ユーザー一覧へ戻る</a>
    </header>

    <main class="content-main content-main--form">
        <!-- 画面タイトルと説明 -->
        <div class="page-heading">
            <div>
                <p class="eyebrow">CONFIRM CHANGES</p>
                <h1>ユーザー情報の確認</h1>
                <p>変更内容をご確認のうえ、更新を完了してください。</p>
            </div>
        </div>

        <section class="panel detail-panel">
            <!-- 権限・性別・雇用形態・所属の表示用メッセージを取得する。 -->
            <div th:with="
                    roleKey=${'role.' + user.role},
                    genderKey=${'gender.' + user.gender},
                    employmentTypeKey=${'employment_type.' + user.employmentType},
                    departmentKey=${'department.' + user.department},
                    roleMsg=${#messages.msg(roleKey)},
                    genderMsg=${#messages.msg(genderKey)},
                    employmentTypeMsg=${#messages.msg(employmentTypeKey)},
                    departmentMsg=${#messages.msg(departmentKey)}
                ">
                <!-- 確認した編集内容を更新完了処理へ送信する。 -->
                <form class="confirmation-form" th:action="@{/user/edit/complete}"
                      method="post" th:object="${user}">
                    <!-- CSRF 対策用のトークン -->
                    <input type="hidden" th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <!-- ユーザーの基本情報 -->
                    <p>ユーザー名: <span th:text="*{username}"></span></p>
                    <p>姓: <span th:text="*{firstName}"></span></p>
                    <p>名: <span th:text="*{lastName}"></span></p>

                    <!-- 姓・名のフリガナ -->
                    <p>姓（フリガナ）: <span th:text="*{firstNameKana}"></span></p>
                    <p>名（フリガナ）: <span th:text="*{lastNameKana}"></span></p>

                    <p>ユーザーロール: <span th:text="${roleMsg}"></span></p>
                    <p>生年月日: <span th:text="*{birthDate}"></span></p>
                    <p>性別: <span th:text="${genderMsg}"></span></p>
                    <p>雇用形態: <span th:text="${employmentTypeMsg}"></span></p>

                    <!-- パート職員の場合のみ曜日別の勤務スケジュールを表示する。 -->
                    <div class="schedule-summary"
                         th:if="${user.employmentType == 'parttime'}">
                        <p><strong>固定勤務スケジュール:</strong></p>
                        <ul>
                            <!-- 月曜日 -->
                            <li>
                                月曜日:
                                <span th:if="${user.mondayOff == true}">休み</span>
                                <span th:unless="${user.mondayOff == true}">
                                    <span th:text="${#strings.isEmpty(user.mondayStartTime)
                                        ? '未設定' : user.mondayStartTime}"></span>
                                    〜
                                    <span th:text="${#strings.isEmpty(user.mondayEndTime)
                                        ? '未設定' : user.mondayEndTime}"></span>
                                </span>
                            </li>

                            <!-- 火曜日 -->
                            <li>
                                火曜日:
                                <span th:if="${user.tuesdayOff == true}">休み</span>
                                <span th:unless="${user.tuesdayOff == true}">
                                    <span th:text="${#strings.isEmpty(user.tuesdayStartTime)
                                        ? '未設定' : user.tuesdayStartTime}"></span>
                                    〜
                                    <span th:text="${#strings.isEmpty(user.tuesdayEndTime)
                                        ? '未設定' : user.tuesdayEndTime}"></span>
                                </span>
                            </li>

                            <!-- 水曜日 -->
                            <li>
                                水曜日:
                                <span th:if="${user.wednesdayOff == true}">休み</span>
                                <span th:unless="${user.wednesdayOff == true}">
                                    <span th:text="${#strings.isEmpty(user.wednesdayStartTime)
                                        ? '未設定' : user.wednesdayStartTime}"></span>
                                    〜
                                    <span th:text="${#strings.isEmpty(user.wednesdayEndTime)
                                        ? '未設定' : user.wednesdayEndTime}"></span>
                                </span>
                            </li>

                            <!-- 木曜日 -->
                            <li>
                                木曜日:
                                <span th:if="${user.thursdayOff == true}">休み</span>
                                <span th:unless="${user.thursdayOff == true}">
                                    <span th:text="${#strings.isEmpty(user.thursdayStartTime)
                                        ? '未設定' : user.thursdayStartTime}"></span>
                                    〜
                                    <span th:text="${#strings.isEmpty(user.thursdayEndTime)
                                        ? '未設定' : user.thursdayEndTime}"></span>
                                </span>
                            </li>

                            <!-- 金曜日 -->
                            <li>
                                金曜日:
                                <span th:if="${user.fridayOff == true}">休み</span>
                                <span th:unless="${user.fridayOff == true}">
                                    <span th:text="${#strings.isEmpty(user.fridayStartTime)
                                        ? '未設定' : user.fridayStartTime}"></span>
                                    〜
                                    <span th:text="${#strings.isEmpty(user.fridayEndTime)
                                        ? '未設定' : user.fridayEndTime}"></span>
                                </span>
                            </li>

                            <!-- 土曜日 -->
                            <li>
                                土曜日:
                                <span th:if="${user.saturdayOff == true}">休み</span>
                                <span th:unless="${user.saturdayOff == true}">
                                    <span th:text="${#strings.isEmpty(user.saturdayStartTime)
                                        ? '未設定' : user.saturdayStartTime}"></span>
                                    〜
                                    <span th:text="${#strings.isEmpty(user.saturdayEndTime)
                                        ? '未設定' : user.saturdayEndTime}"></span>
                                </span>
                            </li>

                            <!-- 日曜日 -->
                            <li>
                                日曜日:
                                <span th:if="${user.sundayOff == true}">休み</span>
                                <span th:unless="${user.sundayOff == true}">
                                    <span th:text="${#strings.isEmpty(user.sundayStartTime)
                                        ? '未設定' : user.sundayStartTime}"></span>
                                    〜
                                    <span th:text="${#strings.isEmpty(user.sundayEndTime)
                                        ? '未設定' : user.sundayEndTime}"></span>
                                </span>
                            </li>
                        </ul>
                    </div>

                    <!-- 所属部署 -->
                    <p>所属: <span th:text="${departmentMsg}"></span></p>

                    <!-- 更新対象のユーザー ID と基本情報を完了処理へ引き継ぐ。 -->
                    <input type="hidden" th:field="*{id}">
                    <input type="hidden" th:field="*{username}">
                    <input type="hidden" th:field="*{firstName}">
                    <input type="hidden" th:field="*{lastName}">

                    <!-- フリガナも送信し、更新時の入力漏れを防ぐ。 -->
                    <input type="hidden" th:field="*{firstNameKana}">
                    <input type="hidden" th:field="*{lastNameKana}">

                    <input type="hidden" th:field="*{role}">
                    <input type="hidden" th:field="*{birthDate}">
                    <input type="hidden" th:field="*{gender}">
                    <input type="hidden" th:field="*{employmentType}">
                    <input type="hidden" th:field="*{department}">

                    <!-- 月曜日の固定勤務スケジュール -->
                    <input type="hidden" th:field="*{mondayOff}">
                    <input type="hidden" th:field="*{mondayStartTime}">
                    <input type="hidden" th:field="*{mondayEndTime}">

                    <!-- 火曜日の固定勤務スケジュール -->
                    <input type="hidden" th:field="*{tuesdayOff}">
                    <input type="hidden" th:field="*{tuesdayStartTime}">
                    <input type="hidden" th:field="*{tuesdayEndTime}">

                    <!-- 水曜日の固定勤務スケジュール -->
                    <input type="hidden" th:field="*{wednesdayOff}">
                    <input type="hidden" th:field="*{wednesdayStartTime}">
                    <input type="hidden" th:field="*{wednesdayEndTime}">

                    <!-- 木曜日の固定勤務スケジュール -->
                    <input type="hidden" th:field="*{thursdayOff}">
                    <input type="hidden" th:field="*{thursdayStartTime}">
                    <input type="hidden" th:field="*{thursdayEndTime}">

                    <!-- 金曜日の固定勤務スケジュール -->
                    <input type="hidden" th:field="*{fridayOff}">
                    <input type="hidden" th:field="*{fridayStartTime}">
                    <input type="hidden" th:field="*{fridayEndTime}">

                    <!-- 土曜日の固定勤務スケジュール -->
                    <input type="hidden" th:field="*{saturdayOff}">
                    <input type="hidden" th:field="*{saturdayStartTime}">
                    <input type="hidden" th:field="*{saturdayEndTime}">

                    <!-- 日曜日の固定勤務スケジュール -->
                    <input type="hidden" th:field="*{sundayOff}">
                    <input type="hidden" th:field="*{sundayStartTime}">
                    <input type="hidden" th:field="*{sundayEndTime}">

                    <!-- 編集内容を保存するか、入力画面へ戻る。 -->
                    <div class="detail-actions">
                        <button class="button button--primary" type="submit">完了</button>
                        <a class="button button--secondary"
                           th:href="@{/user/edit/{id}(id=${user.id})}">戻る</a>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer class="app-footer">© ShiftManager</footer>
</body>
</html>
