<!DOCTYPE html>

<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>ユーザー編集確認</title>

    <!-- 既存の画面デザイン用スタイルシート -->
    <link
        rel="stylesheet"
        th:href="@{/css/style.css}"
        href="/css/style.css">
</head>

<body>

    <h2>ユーザー情報の確認</h2>

    <!--
        事前にメッセージキーを解決する。

        role.ADMIN                  : 管理者
        role.USER                   : 一般ユーザー
        gender.male                 : 男性
        gender.female               : 女性
        employment_type.fulltime    : 正社員
        employment_type.parttime    : パート
        department.amami            : 天美
        department.main             : 本社
    -->
    <div
        th:with="
            roleKey=${'role.' + user.role},
            genderKey=${'gender.' + user.gender},
            employmentTypeKey=${'employment_type.' + user.employmentType},
            departmentKey=${'department.' + user.department},
            roleMsg=${#messages.msg(roleKey)},
            genderMsg=${#messages.msg(genderKey)},
            employmentTypeMsg=${#messages.msg(employmentTypeKey)},
            departmentMsg=${#messages.msg(departmentKey)}
        ">

        <!--
            編集内容を UserProfileViewController の
            /user/edit/complete に送信する。
        -->
        <form
            th:action="@{/user/edit/complete}"
            method="post"
            th:object="${user}">

            <!-- CSRFトークン -->
            <input
                type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}">

            <!-- ユーザー名 -->
            <p>
                ユーザー名:
                <span th:text="*{username}"></span>
            </p>

            <!-- 姓 -->
            <p>
                姓:
                <span th:text="*{firstName}"></span>
            </p>

            <!-- 名 -->
            <p>
                名:
                <span th:text="*{lastName}"></span>
            </p>

            <!-- ユーザーロール -->
            <p>
                ユーザーロール:
                <span th:text="${roleMsg}"></span>
            </p>

            <!-- 生年月日 -->
            <p>
                生年月日:
                <span th:text="*{birthDate}"></span>
            </p>

            <!-- 性別 -->
            <p>
                性別:
                <span th:text="${genderMsg}"></span>
            </p>

            <!-- 雇用形態 -->
            <p>
                雇用形態:
                <span th:text="${employmentTypeMsg}"></span>
            </p>

            <!--
                固定勤務スケジュール。

                パート職員の場合のみ表示する。

                UserProfileDto には fixedWorkSchedule が存在しないため、
                mondayOff、mondayStartTime などの既存フィールドを
                曜日ごとに直接参照する。
            -->
            <div th:if="${user.employmentType == 'parttime'}">

                <p>
                    <strong>固定勤務スケジュール:</strong>
                </p>

                <ul>

                    <!-- 月曜日 -->
                    <li>
                        月曜日:

                        <span th:if="${user.mondayOff == true}">
                            休み
                        </span>

                        <span th:unless="${user.mondayOff == true}">
                            <span
                                th:text="${#strings.isEmpty(user.mondayStartTime)
                                    ? '未設定'
                                    : user.mondayStartTime}">
                            </span>

                            〜

                            <span
                                th:text="${#strings.isEmpty(user.mondayEndTime)
                                    ? '未設定'
                                    : user.mondayEndTime}">
                            </span>
                        </span>
                    </li>

                    <!-- 火曜日 -->
                    <li>
                        火曜日:

                        <span th:if="${user.tuesdayOff == true}">
                            休み
                        </span>

                        <span th:unless="${user.tuesdayOff == true}">
                            <span
                                th:text="${#strings.isEmpty(user.tuesdayStartTime)
                                    ? '未設定'
                                    : user.tuesdayStartTime}">
                            </span>

                            〜

                            <span
                                th:text="${#strings.isEmpty(user.tuesdayEndTime)
                                    ? '未設定'
                                    : user.tuesdayEndTime}">
                            </span>
                        </span>
                    </li>

                    <!-- 水曜日 -->
                    <li>
                        水曜日:

                        <span th:if="${user.wednesdayOff == true}">
                            休み
                        </span>

                        <span th:unless="${user.wednesdayOff == true}">
                            <span
                                th:text="${#strings.isEmpty(user.wednesdayStartTime)
                                    ? '未設定'
                                    : user.wednesdayStartTime}">
                            </span>

                            〜

                            <span
                                th:text="${#strings.isEmpty(user.wednesdayEndTime)
                                    ? '未設定'
                                    : user.wednesdayEndTime}">
                            </span>
                        </span>
                    </li>

                    <!-- 木曜日 -->
                    <li>
                        木曜日:

                        <span th:if="${user.thursdayOff == true}">
                            休み
                        </span>

                        <span th:unless="${user.thursdayOff == true}">
                            <span
                                th:text="${#strings.isEmpty(user.thursdayStartTime)
                                    ? '未設定'
                                    : user.thursdayStartTime}">
                            </span>

                            〜

                            <span
                                th:text="${#strings.isEmpty(user.thursdayEndTime)
                                    ? '未設定'
                                    : user.thursdayEndTime}">
                            </span>
                        </span>
                    </li>

                    <!-- 金曜日 -->
                    <li>
                        金曜日:

                        <span th:if="${user.fridayOff == true}">
                            休み
                        </span>

                        <span th:unless="${user.fridayOff == true}">
                            <span
                                th:text="${#strings.isEmpty(user.fridayStartTime)
                                    ? '未設定'
                                    : user.fridayStartTime}">
                            </span>

                            〜

                            <span
                                th:text="${#strings.isEmpty(user.fridayEndTime)
                                    ? '未設定'
                                    : user.fridayEndTime}">
                            </span>
                        </span>
                    </li>

                    <!-- 土曜日 -->
                    <li>
                        土曜日:

                        <span th:if="${user.saturdayOff == true}">
                            休み
                        </span>

                        <span th:unless="${user.saturdayOff == true}">
                            <span
                                th:text="${#strings.isEmpty(user.saturdayStartTime)
                                    ? '未設定'
                                    : user.saturdayStartTime}">
                            </span>

                            〜

                            <span
                                th:text="${#strings.isEmpty(user.saturdayEndTime)
                                    ? '未設定'
                                    : user.saturdayEndTime}">
                            </span>
                        </span>
                    </li>

                    <!-- 日曜日 -->
                    <li>
                        日曜日:

                        <span th:if="${user.sundayOff == true}">
                            休み
                        </span>

                        <span th:unless="${user.sundayOff == true}">
                            <span
                                th:text="${#strings.isEmpty(user.sundayStartTime)
                                    ? '未設定'
                                    : user.sundayStartTime}">
                            </span>

                            〜

                            <span
                                th:text="${#strings.isEmpty(user.sundayEndTime)
                                    ? '未設定'
                                    : user.sundayEndTime}">
                            </span>
                        </span>
                    </li>

                </ul>

            </div>

            <!-- 所属部署 -->
            <p>
                所属:
                <span th:text="${departmentMsg}"></span>
            </p>

            <!--
                編集内容を完了処理へ引き継ぐ。

                hidden 項目を設定しないと、確認画面から送信した際に
                DTO のフィールドが空になり、入力内容を保持できない。

                パスワードは編集対象外のため送信しない。
            -->

            <!-- 更新対象のユーザーID -->
            <input
                type="hidden"
                th:field="*{id}">

            <!-- 基本情報 -->
            <input
                type="hidden"
                th:field="*{username}">

            <input
                type="hidden"
                th:field="*{firstName}">

            <input
                type="hidden"
                th:field="*{lastName}">

            <input
                type="hidden"
                th:field="*{role}">

            <input
                type="hidden"
                th:field="*{birthDate}">

            <input
                type="hidden"
                th:field="*{gender}">

            <input
                type="hidden"
                th:field="*{employmentType}">

            <input
                type="hidden"
                th:field="*{department}">

            <!--
                勤務スケジュールを hidden で送信する。

                画面にはパート職員の場合のみ勤務スケジュールを表示するが、
                送信項目は常に保持し、確認画面から完了処理への引き継ぎや
                保存失敗時の再表示に備える。
            -->

            <!-- 月曜日 -->
            <input
                type="hidden"
                th:field="*{mondayOff}">

            <input
                type="hidden"
                th:field="*{mondayStartTime}">

            <input
                type="hidden"
                th:field="*{mondayEndTime}">

            <!-- 火曜日 -->
            <input
                type="hidden"
                th:field="*{tuesdayOff}">

            <input
                type="hidden"
                th:field="*{tuesdayStartTime}">

            <input
                type="hidden"
                th:field="*{tuesdayEndTime}">

            <!-- 水曜日 -->
            <input
                type="hidden"
                th:field="*{wednesdayOff}">

            <input
                type="hidden"
                th:field="*{wednesdayStartTime}">

            <input
                type="hidden"
                th:field="*{wednesdayEndTime}">

            <!-- 木曜日 -->
            <input
                type="hidden"
                th:field="*{thursdayOff}">

            <input
                type="hidden"
                th:field="*{thursdayStartTime}">

            <input
                type="hidden"
                th:field="*{thursdayEndTime}">

            <!-- 金曜日 -->
            <input
                type="hidden"
                th:field="*{fridayOff}">

            <input
                type="hidden"
                th:field="*{fridayStartTime}">

            <input
                type="hidden"
                th:field="*{fridayEndTime}">

            <!-- 土曜日 -->
            <input
                type="hidden"
                th:field="*{saturdayOff}">

            <input
                type="hidden"
                th:field="*{saturdayStartTime}">

            <input
                type="hidden"
                th:field="*{saturdayEndTime}">

            <!-- 日曜日 -->
            <input
                type="hidden"
                th:field="*{sundayOff}">

            <input
                type="hidden"
                th:field="*{sundayStartTime}">

            <input
                type="hidden"
                th:field="*{sundayEndTime}">

            <!-- 編集内容を保存する -->
            <button type="submit">
                完了
            </button>

            <!-- 対象ユーザーの編集画面へ戻る -->
            <a th:href="@{/user/edit/{id}(id=${user.id})}">
                戻る
            </a>

        </form>

    </div>

</body>

</html>
