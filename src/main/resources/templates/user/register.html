<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー登録 | ShiftManager</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <link rel="stylesheet" th:href="@{/css/user.css}" href="/css/user.css">
</head>
<body class="app-page">
    <header class="app-header">
        <a class="brand brand--dark" th:href="@{/home}" href="/home" aria-label="ShiftManager ホーム">
            <span class="brand__mark" aria-hidden="true">S</span>
            <span>ShiftManager</span>
        </a>
        <a class="header-back-link" th:href="@{/user/list}" href="/user/list">← ユーザー一覧へ戻る</a>
    </header>

    <main class="content-main content-main--form">
        <div class="page-heading">
            <div>
                <p class="eyebrow">NEW USER</p>
                <h1>ユーザー登録</h1>
                <p>ログイン情報と職員情報を入力してください。</p>
            </div>
        </div>

        <form class="registration-form" action="/user/register/confirm" method="post" th:object="${userProfileDto}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <section class="form-section" aria-labelledby="account-title">
                <div class="form-section__heading">
                    <span class="form-section__number">01</span>
                    <div><h2 id="account-title">アカウント情報</h2><p>ログイン時に使用する情報です。</p></div>
                </div>
                <div class="form-grid">
                    <div class="form-field form-field--wide">
                        <label for="username">ユーザー名 <span class="required-label">必須</span></label>
                        <input type="text" id="username" th:field="*{username}" maxlength="100" autocomplete="username" required>
                        <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
                    </div>
                    <div class="form-field form-field--wide">
                        <label for="password">パスワード <span class="required-label">必須</span></label>
                        <input type="password" id="password" th:field="*{password}" minlength="4" autocomplete="new-password" required>
                        <span class="field-help">4文字以上で入力してください。</span>
                        <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                    </div>
                    <div class="form-field">
                        <label for="role">ユーザーロール <span class="required-label">必須</span></label>
                        <select id="role" th:field="*{role}" required>
                            <option value="">選択してください</option><option value="ADMIN">管理者</option><option value="USER">一般ユーザー</option>
                        </select>
                        <p class="field-error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></p>
                    </div>
                </div>
            </section>

            <section class="form-section" aria-labelledby="profile-title">
                <div class="form-section__heading">
                    <span class="form-section__number">02</span>
                    <div><h2 id="profile-title">基本情報</h2><p>職員の氏名・所属情報を入力します。</p></div>
                </div>
                <div class="form-grid">
                    <div class="form-field"><label for="firstName">姓 <span class="required-label">必須</span></label><input type="text" id="firstName" th:field="*{firstName}" required><p class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></p></div>
                    <div class="form-field"><label for="lastName">名 <span class="required-label">必須</span></label><input type="text" id="lastName" th:field="*{lastName}" required><p class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></p></div>
                    <div class="form-field"><label for="birthDate">生年月日</label><input type="date" id="birthDate" th:field="*{birthDate}"><p class="field-error" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></p></div>
                    <div class="form-field"><label for="gender">性別</label><select id="gender" th:field="*{gender}"><option value="male">男性</option><option value="female">女性</option></select><p class="field-error" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></p></div>
                    <div class="form-field"><label for="employmentType">雇用形態</label><select id="employmentType" th:field="*{employmentType}" onchange="togglePartTimeFields()"><option value="fulltime">正社員</option><option value="parttime">パート</option></select><p class="field-error" th:if="${#fields.hasErrors('employmentType')}" th:errors="*{employmentType}"></p></div>
                    <div class="form-field"><label for="department">所属</label><select id="department" th:field="*{department}"><option value="amami">天美</option><option value="main">本社</option></select><p class="field-error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></p></div>
                </div>
            </section>

            <section class="form-section part-time-section" id="partTimeFields" aria-labelledby="schedule-title" hidden>
                <div class="form-section__heading">
                    <span class="form-section__number">03</span>
                    <div><h2 id="schedule-title">固定勤務スケジュール</h2><p>曜日ごとの勤務時間、または休みを設定します。</p></div>
                </div>
                <div class="schedule-list">
                    <div class="schedule-row"><span class="schedule-row__day">月曜日</span><label class="check-label"><input type="checkbox" id="mondayOff" th:field="*{mondayOff}" onchange="toggleWorkTime('monday')"><span>休み</span></label><div class="time-range"><select id="mondayStartTime" th:field="*{mondayStartTime}" aria-label="月曜日の開始時間"><option value="">開始</option><option th:each="t : ${timeOptions}" th:value="${t}" th:text="${t}"></option></select><span>〜</span><select id="mondayEndTime" th:field="*{mondayEndTime}" aria-label="月曜日の終了時間"><option value="">終了</option><option th:each="t : ${timeOptions}" th:value="${t}" th:text="${t}"></option></select></div></div>
                    <div class="schedule-row"><span class="schedule-row__day">火曜日</span><label class="check-label"><input type="checkbox" id="tuesdayOff" th:field="*{tuesdayOff}" onchange="toggleWorkTime('tuesday')"><span>休み</span></label><div class="time-range"><select id="tuesdayStartTime" th:field="*{tuesdayStartTime}" aria-label="火曜日の開始時間"><option value="">開始</option><option th:each="t : ${timeOptions}" th:value="${t}" th:text="${t}"></option></select><span>〜</span><select id="tuesdayEndTime" th:field="*{tuesdayEndTime}" aria-label="火曜日の終了時間"><option value="">終了</option><option th:each="t : ${timeOptions}" th:value="${t}" th:text="${t}"></option></select></div></div>
                    <div class="schedule-row"><span class="schedule-row__day">水曜日</span><label class="check-label"><input type="checkbox" id="wednesdayOff" th:field="*{wednesdayOff}" onchange="toggleWorkTime('wednesday')"><span>休み</span></label><div class="time-range"><select id="wednesdayStartTime" th:field="*{wednesdayStartTime}" aria-label="水曜日の開始時間"><option value="">開始</option><option th:each="t : ${timeOptions}" th:value="${t}" th:text="${t}"></option></select><span>〜</span><select id="wednesdayEndTime" th:field="*{wednesdayEndTime}" aria-label="水曜日の終了時間"><option value="">終了</option><option th:each="t : ${timeOptions}" th:value="${t}" th:text="${t}"></option></select></div></div>
                    <div class="schedule-row"><span class="schedule-row__day">木曜日</span><label class="check-label"><input type="checkbox" id="thursdayOff" th:field="*{thursdayOff}" onchange="toggleWorkTime('thursday')"><span>休み</span></label><div class="time-range"><select id="thursdayStartTime" th:field="*{thursdayStartTime}" aria-label="木曜日の開始時間"><option value="">開始</option><option th:each="t : ${timeOptions}" th:value="${t}" th:text="${t}"></option></select><span>〜</span><select id="thursdayEndTime" th:field="*{thursdayEndTime}" aria-label="木曜日の終了時間"><option value="">終了</option><option th:each="t : ${timeOptions}" th:value="${t}" th:text="${t}"></option></select></div></div>
                    <div class="schedule-row"><span class="schedule-row__day">金曜日</span><label class="check-label"><input type="checkbox" id="fridayOff" th:field="*{fridayOff}" onchange="toggleWorkTime('friday')"><span>休み</span></label><div class="time-range"><select id="fridayStartTime" th:field="*{fridayStartTime}" aria-label="金曜日の開始時間"><option value="">開始</option><option th:each="t : ${timeOptions}" th:value="${t}" th:text="${t}"></option></select><span>〜</span><select id="fridayEndTime" th:field="*{fridayEndTime}" aria-label="金曜日の終了時間"><option value="">終了</option><option th:each="t : ${timeOptions}" th:value="${t}" th:text="${t}"></option></select></div></div>
                    <div class="schedule-row"><span class="schedule-row__day">土曜日</span><label class="check-label"><input type="checkbox" id="saturdayOff" th:field="*{saturdayOff}" onchange="toggleWorkTime('saturday')"><span>休み</span></label><div class="time-range"><select id="saturdayStartTime" th:field="*{saturdayStartTime}" aria-label="土曜日の開始時間"><option value="">開始</option><option th:each="t : ${timeOptions}" th:value="${t}" th:text="${t}"></option></select><span>〜</span><select id="saturdayEndTime" th:field="*{saturdayEndTime}" aria-label="土曜日の終了時間"><option value="">終了</option><option th:each="t : ${timeOptions}" th:value="${t}" th:text="${t}"></option></select></div></div>
                    <div class="schedule-row"><span class="schedule-row__day">日曜日</span><label class="check-label"><input type="checkbox" id="sundayOff" th:field="*{sundayOff}" onchange="toggleWorkTime('sunday')"><span>休み</span></label><div class="time-range"><select id="sundayStartTime" th:field="*{sundayStartTime}" aria-label="日曜日の開始時間"><option value="">開始</option><option th:each="t : ${timeOptions}" th:value="${t}" th:text="${t}"></option></select><span>〜</span><select id="sundayEndTime" th:field="*{sundayEndTime}" aria-label="日曜日の終了時間"><option value="">終了</option><option th:each="t : ${timeOptions}" th:value="${t}" th:text="${t}"></option></select></div></div>
                </div>
            </section>

            <div class="form-actions">
                <a class="button button--secondary" th:href="@{/home}" href="/home">キャンセル</a>
                <button class="button button--primary" type="submit">入力内容を確認 <span aria-hidden="true">→</span></button>
            </div>
        </form>
    </main>

    <footer class="app-footer">© ShiftManager</footer>
    <script>
        const days = ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"];
        function togglePartTimeFields() {
            const section = document.getElementById("partTimeFields");
            section.hidden = document.getElementById("employmentType").value !== "parttime";
        }
        function toggleWorkTime(day) {
            const isOff = document.getElementById(`${day}Off`).checked;
            const start = document.getElementById(`${day}StartTime`);
            const end = document.getElementById(`${day}EndTime`);
            start.disabled = isOff; end.disabled = isOff;
            if (isOff) { start.value = ""; end.value = ""; }
        }
        document.addEventListener("DOMContentLoaded", () => {
            togglePartTimeFields();
            days.forEach(toggleWorkTime);
        });
    </script>
</body>
</html>
