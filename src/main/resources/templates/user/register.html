<!DOCTYPE html>

<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ユーザー登録 | ShiftManager</title>

    <!-- アプリケーション全体で使用する共通スタイル -->
    <link
        rel="stylesheet"
        th:href="@{/css/app.css}"
        href="/css/app.css">

    <!-- ユーザー登録・編集画面で使用する個別スタイル -->
    <link
        rel="stylesheet"
        th:href="@{/css/user.css}"
        href="/css/user.css">

    <style>
        /*
         * 登録画面上部に表示するエラーメッセージ。
         *
         * データベースへの保存に失敗した場合や、
         * 入力内容に誤りがある場合の案内に使用する。
         */
        .registration-error-message {
            margin: 0 0 20px;
            padding: 12px 16px;
            border: 1px solid #d32f2f;
            border-radius: 6px;
            background-color: #ffebee;
            color: #b71c1c;
        }

        /*
         * フォーム全体に関するバリデーションエラー。
         *
         * 特定の入力項目に紐付かないエラーがある場合に表示する。
         */
        .registration-global-errors {
            margin: 0 0 20px;
            padding: 12px 16px;
            border: 1px solid #d32f2f;
            border-radius: 6px;
            background-color: #ffebee;
            color: #b71c1c;
        }

        .registration-global-errors ul {
            margin: 8px 0 0;
            padding-left: 20px;
        }

        .registration-global-errors li + li {
            margin-top: 4px;
        }
    </style>
</head>

<body class="app-page">

    <!--
        画面共通ヘッダー。

        ロゴからホーム画面へ移動できるほか、
        ユーザー一覧画面へ戻るリンクを表示する。
    -->
    <header class="app-header">

        <a
            class="brand brand--dark"
            th:href="@{/home}"
            href="/home"
            aria-label="ShiftManager ホーム">

            <span
                class="brand__mark"
                aria-hidden="true">

                S

            </span>

            <span>ShiftManager</span>

        </a>

        <a
            class="header-back-link"
            th:href="@{/user/list}"
            href="/user/list">

            ← ユーザー一覧へ戻る

        </a>

    </header>

    <main class="content-main content-main--form">

        <!-- ページタイトルと画面の説明 -->
        <div class="page-heading">

            <div>

                <p class="eyebrow">NEW USER</p>

                <h1>ユーザー登録</h1>

                <p>ログイン情報と職員情報を入力してください。</p>

            </div>

        </div>

        <!--
            登録処理に失敗した場合のメッセージ。

            RegistrationController 側で以下のように設定した内容を表示する。

            model.addAttribute(
                "errorMessage",
                "ユーザー情報の保存に失敗しました。入力内容を確認してください。"
            );

            入力済みの userProfileDto をそのまま画面へ戻すことで、
            パスワード以外の入力内容を維持する。
        -->
        <div
            class="registration-error-message"
            th:if="${errorMessage != null and !#strings.isEmpty(errorMessage)}"
            th:text="${errorMessage}"
            role="alert">

        </div>

        <!--
            ユーザー登録フォーム。

            userProfileDto と各入力項目を th:field で紐付ける。

            入力エラー時に Controller から "user/register" を返すと、
            入力済みの内容と項目ごとのエラーメッセージが再表示される。
        -->
        <form
            class="registration-form"
            action="/user/register/confirm"
            method="post"
            th:object="${userProfileDto}">

            <!-- Spring Security の CSRF 対策用トークン -->
            <input
                type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}">

            <!--
                特定項目に紐付かないフォーム全体のエラー。

                例：
                ・複数項目の組み合わせが不正
                ・業務ルールに基づく全体チェックでエラー
            -->
            <div
                class="registration-global-errors"
                th:if="${#fields.hasGlobalErrors()}"
                role="alert">

                <strong>入力内容をご確認ください。</strong>

                <ul>

                    <li
                        th:each="error : ${#fields.globalErrors()}"
                        th:text="${error}">

                    </li>

                </ul>

            </div>

            <!--
                01：アカウント情報。

                ユーザー名、パスワード、権限を入力する。

                パスワードは新規登録時のみ必須とし、
                編集画面とは別のバリデーショングループで検証する。
            -->
            <section
                class="form-section"
                aria-labelledby="account-title">

                <div class="form-section__heading">

                    <span class="form-section__number">01</span>

                    <div>

                        <h2 id="account-title">アカウント情報</h2>

                        <p>ログイン時に使用する情報です。</p>

                    </div>

                </div>

                <div class="form-grid">

                    <!-- ユーザー名 -->
                    <div class="form-field form-field--wide">

                        <label for="username">

                            ユーザー名

                            <span class="required-label">必須</span>

                        </label>

                        <input
                            type="text"
                            id="username"
                            th:field="*{username}"
                            maxlength="100"
                            autocomplete="username"
                            required>

                        <!-- ユーザー名の入力エラー -->
                        <p
                            class="field-error"
                            th:if="${#fields.hasErrors('username')}"
                            th:errors="*{username}">

                        </p>

                    </div>

                    <!-- 新規登録時のパスワード -->
                    <div class="form-field form-field--wide">

                        <label for="password">

                            パスワード

                            <span class="required-label">必須</span>

                        </label>

                        <input
                            type="password"
                            id="password"
                            th:field="*{password}"
                            minlength="4"
                            autocomplete="new-password"
                            required>

                        <span class="field-help">

                            4文字以上で入力してください。

                        </span>

                        <!-- パスワードの入力エラー -->
                        <p
                            class="field-error"
                            th:if="${#fields.hasErrors('password')}"
                            th:errors="*{password}">

                        </p>

                    </div>

                    <!-- ユーザーの権限 -->
                    <div class="form-field">

                        <label for="role">

                            ユーザーロール

                            <span class="required-label">必須</span>

                        </label>

                        <select
                            id="role"
                            th:field="*{role}"
                            required>

                            <option value="">

                                選択してください

                            </option>

                            <option value="ADMIN">

                                管理者

                            </option>

                            <option value="USER">

                                一般ユーザー

                            </option>

                        </select>

                        <!-- 権限の入力エラー -->
                        <p
                            class="field-error"
                            th:if="${#fields.hasErrors('role')}"
                            th:errors="*{role}">

                        </p>

                    </div>

                </div>

            </section>

            <!--
                02：職員の基本情報。

                氏名、フリガナ、生年月日、性別、雇用形態、所属部署を入力する。
            -->
            <section
                class="form-section"
                aria-labelledby="profile-title">

                <div class="form-section__heading">

                    <span class="form-section__number">02</span>

                    <div>

                        <h2 id="profile-title">基本情報</h2>

                        <p>職員の氏名・所属情報を入力します。</p>

                    </div>

                </div>

                <div class="form-grid">

                    <!-- 姓 -->
                    <div class="form-field">

                        <label for="firstName">

                            姓

                            <span class="required-label">必須</span>

                        </label>

                        <input
                            type="text"
                            id="firstName"
                            th:field="*{firstName}"
                            maxlength="50"
                            required>

                        <p
                            class="field-error"
                            th:if="${#fields.hasErrors('firstName')}"
                            th:errors="*{firstName}">

                        </p>

                    </div>

                    <!-- 名 -->
                    <div class="form-field">

                        <label for="lastName">

                            名

                            <span class="required-label">必須</span>

                        </label>

                        <input
                            type="text"
                            id="lastName"
                            th:field="*{lastName}"
                            maxlength="50"
                            required>

                        <p
                            class="field-error"
                            th:if="${#fields.hasErrors('lastName')}"
                            th:errors="*{lastName}">

                        </p>

                    </div>

                    <!-- 姓のフリガナ -->
                    <div class="form-field">

                        <label for="firstNameKana">

                            姓（フリガナ）

                            <span class="required-label">必須</span>

                        </label>

                        <input
                            type="text"
                            id="firstNameKana"
                            th:field="*{firstNameKana}"
                            maxlength="50"
                            placeholder="例：ヤマダ"
                            required>

                        <p
                            class="field-error"
                            th:if="${#fields.hasErrors('firstNameKana')}"
                            th:errors="*{firstNameKana}">

                        </p>

                    </div>

                    <!-- 名のフリガナ -->
                    <div class="form-field">

                        <label for="lastNameKana">

                            名（フリガナ）

                            <span class="required-label">必須</span>

                        </label>

                        <input
                            type="text"
                            id="lastNameKana"
                            th:field="*{lastNameKana}"
                            maxlength="50"
                            placeholder="例：タロウ"
                            required>

                        <p
                            class="field-error"
                            th:if="${#fields.hasErrors('lastNameKana')}"
                            th:errors="*{lastNameKana}">

                        </p>

                    </div>

                    <!-- 生年月日 -->
                    <div class="form-field">

                        <label for="birthDate">

                            生年月日

                        </label>

                        <input
                            type="date"
                            id="birthDate"
                            th:field="*{birthDate}">

                        <p
                            class="field-error"
                            th:if="${#fields.hasErrors('birthDate')}"
                            th:errors="*{birthDate}">

                        </p>

                    </div>

                    <!-- 性別 -->
                    <div class="form-field">

                        <label for="gender">

                            性別

                        </label>

                        <select
                            id="gender"
                            th:field="*{gender}">

                            <option value="male">

                                男性

                            </option>

                            <option value="female">

                                女性

                            </option>

                        </select>

                        <p
                            class="field-error"
                            th:if="${#fields.hasErrors('gender')}"
                            th:errors="*{gender}">

                        </p>

                    </div>

                    <!--
                        雇用形態。

                        パートを選択した場合のみ、
                        固定勤務スケジュールの入力欄を表示する。
                    -->
                    <div class="form-field">

                        <label for="employmentType">

                            雇用形態

                        </label>

                        <select
                            id="employmentType"
                            th:field="*{employmentType}"
                            onchange="togglePartTimeFields()">

                            <option value="fulltime">

                                正社員

                            </option>

                            <option value="parttime">

                                パート

                            </option>

                        </select>

                        <p
                            class="field-error"
                            th:if="${#fields.hasErrors('employmentType')}"
                            th:errors="*{employmentType}">

                        </p>

                    </div>

                    <!-- 所属部署 -->
                    <div class="form-field">

                        <label for="department">

                            所属

                        </label>

                        <select
                            id="department"
                            th:field="*{department}">

                            <option value="amami">

                                天美

                            </option>

                            <option value="main">

                                本社

                            </option>

                        </select>

                        <p
                            class="field-error"
                            th:if="${#fields.hasErrors('department')}"
                            th:errors="*{department}">

                        </p>

                    </div>

                </div>

            </section>

            <!--
                03：パート職員の固定勤務スケジュール。

                雇用形態が parttime の場合のみ表示する。

                timeOptions は RegistrationController から渡される。
                入力エラーや保存エラーで登録画面に戻る場合も、
                Controller 側で timeOptions を再設定する必要がある。
            -->
            <section
                class="form-section part-time-section"
                id="partTimeFields"
                aria-labelledby="schedule-title"
                hidden>

                <div class="form-section__heading">

                    <span class="form-section__number">03</span>

                    <div>

                        <h2 id="schedule-title">

                            固定勤務スケジュール

                        </h2>

                        <p>

                            曜日ごとの勤務時間、または休みを設定します。

                        </p>

                    </div>

                </div>

                <div class="schedule-list">

                    <!-- 月曜日 -->
                    <div class="schedule-row">

                        <span class="schedule-row__day">

                            月曜日

                        </span>

                        <label class="check-label">

                            <input
                                type="checkbox"
                                id="mondayOff"
                                th:field="*{mondayOff}"
                                onchange="toggleWorkTime('monday')">

                            <span>休み</span>

                        </label>

                        <div class="time-range">

                            <select
                                id="mondayStartTime"
                                th:field="*{mondayStartTime}"
                                aria-label="月曜日の開始時間">

                                <option value="">開始</option>

                                <option
                                    th:each="t : ${timeOptions}"
                                    th:value="${t}"
                                    th:text="${t}">

                                </option>

                            </select>

                            <span>〜</span>

                            <select
                                id="mondayEndTime"
                                th:field="*{mondayEndTime}"
                                aria-label="月曜日の終了時間">

                                <option value="">終了</option>

                                <option
                                    th:each="t : ${timeOptions}"
                                    th:value="${t}"
                                    th:text="${t}">

                                </option>

                            </select>

                        </div>

                    </div>

                    <!-- 火曜日 -->
                    <div class="schedule-row">

                        <span class="schedule-row__day">

                            火曜日

                        </span>

                        <label class="check-label">

                            <input
                                type="checkbox"
                                id="tuesdayOff"
                                th:field="*{tuesdayOff}"
                                onchange="toggleWorkTime('tuesday')">

                            <span>休み</span>

                        </label>

                        <div class="time-range">

                            <select
                                id="tuesdayStartTime"
                                th:field="*{tuesdayStartTime}"
                                aria-label="火曜日の開始時間">

                                <option value="">開始</option>

                                <option
                                    th:each="t : ${timeOptions}"
                                    th:value="${t}"
                                    th:text="${t}">

                                </option>

                            </select>

                            <span>〜</span>

                            <select
                                id="tuesdayEndTime"
                                th:field="*{tuesdayEndTime}"
                                aria-label="火曜日の終了時間">

                                <option value="">終了</option>

                                <option
                                    th:each="t : ${timeOptions}"
                                    th:value="${t}"
                                    th:text="${t}">

                                </option>

                            </select>

                        </div>

                    </div>

                    <!-- 水曜日 -->
                    <div class="schedule-row">

                        <span class="schedule-row__day">

                            水曜日

                        </span>

                        <label class="check-label">

                            <input
                                type="checkbox"
                                id="wednesdayOff"
                                th:field="*{wednesdayOff}"
                                onchange="toggleWorkTime('wednesday')">

                            <span>休み</span>

                        </label>

                        <div class="time-range">

                            <select
                                id="wednesdayStartTime"
                                th:field="*{wednesdayStartTime}"
                                aria-label="水曜日の開始時間">

                                <option value="">開始</option>

                                <option
                                    th:each="t : ${timeOptions}"
                                    th:value="${t}"
                                    th:text="${t}">

                                </option>

                            </select>

                            <span>〜</span>

                            <select
                                id="wednesdayEndTime"
                                th:field="*{wednesdayEndTime}"
                                aria-label="水曜日の終了時間">

                                <option value="">終了</option>

                                <option
                                    th:each="t : ${timeOptions}"
                                    th:value="${t}"
                                    th:text="${t}">

                                </option>

                            </select>

                        </div>

                    </div>

                    <!-- 木曜日 -->
                    <div class="schedule-row">

                        <span class="schedule-row__day">

                            木曜日

                        </span>

                        <label class="check-label">

                            <input
                                type="checkbox"
                                id="thursdayOff"
                                th:field="*{thursdayOff}"
                                onchange="toggleWorkTime('thursday')">

                            <span>休み</span>

                        </label>

                        <div class="time-range">

                            <select
                                id="thursdayStartTime"
                                th:field="*{thursdayStartTime}"
                                aria-label="木曜日の開始時間">

                                <option value="">開始</option>

                                <option
                                    th:each="t : ${timeOptions}"
                                    th:value="${t}"
                                    th:text="${t}">

                                </option>

                            </select>

                            <span>〜</span>

                            <select
                                id="thursdayEndTime"
                                th:field="*{thursdayEndTime}"
                                aria-label="木曜日の終了時間">

                                <option value="">終了</option>

                                <option
                                    th:each="t : ${timeOptions}"
                                    th:value="${t}"
                                    th:text="${t}">

                                </option>

                            </select>

                        </div>

                    </div>

                    <!-- 金曜日 -->
                    <div class="schedule-row">

                        <span class="schedule-row__day">

                            金曜日

                        </span>

                        <label class="check-label">

                            <input
                                type="checkbox"
                                id="fridayOff"
                                th:field="*{fridayOff}"
                                onchange="toggleWorkTime('friday')">

                            <span>休み</span>

                        </label>

                        <div class="time-range">

                            <select
                                id="fridayStartTime"
                                th:field="*{fridayStartTime}"
                                aria-label="金曜日の開始時間">

                                <option value="">開始</option>

                                <option
                                    th:each="t : ${timeOptions}"
                                    th:value="${t}"
                                    th:text="${t}">

                                </option>

                            </select>

                            <span>〜</span>

                            <select
                                id="fridayEndTime"
                                th:field="*{fridayEndTime}"
                                aria-label="金曜日の終了時間">

                                <option value="">終了</option>

                                <option
                                    th:each="t : ${timeOptions}"
                                    th:value="${t}"
                                    th:text="${t}">

                                </option>

                            </select>

                        </div>

                    </div>

                    <!-- 土曜日 -->
                    <div class="schedule-row">

                        <span class="schedule-row__day">

                            土曜日

                        </span>

                        <label class="check-label">

                            <input
                                type="checkbox"
                                id="saturdayOff"
                                th:field="*{saturdayOff}"
                                onchange="toggleWorkTime('saturday')">

                            <span>休み</span>

                        </label>

                        <div class="time-range">

                            <select
                                id="saturdayStartTime"
                                th:field="*{saturdayStartTime}"
                                aria-label="土曜日の開始時間">

                                <option value="">開始</option>

                                <option
                                    th:each="t : ${timeOptions}"
                                    th:value="${t}"
                                    th:text="${t}">

                                </option>

                            </select>

                            <span>〜</span>

                            <select
                                id="saturdayEndTime"
                                th:field="*{saturdayEndTime}"
                                aria-label="土曜日の終了時間">

                                <option value="">終了</option>

                                <option
                                    th:each="t : ${timeOptions}"
                                    th:value="${t}"
                                    th:text="${t}">

                                </option>

                            </select>

                        </div>

                    </div>

                    <!-- 日曜日 -->
                    <div class="schedule-row">

                        <span class="schedule-row__day">

                            日曜日

                        </span>

                        <label class="check-label">

                            <input
                                type="checkbox"
                                id="sundayOff"
                                th:field="*{sundayOff}"
                                onchange="toggleWorkTime('sunday')">

                            <span>休み</span>

                        </label>

                        <div class="time-range">

                            <select
                                id="sundayStartTime"
                                th:field="*{sundayStartTime}"
                                aria-label="日曜日の開始時間">

                                <option value="">開始</option>

                                <option
                                    th:each="t : ${timeOptions}"
                                    th:value="${t}"
                                    th:text="${t}">

                                </option>

                            </select>

                            <span>〜</span>

                            <select
                                id="sundayEndTime"
                                th:field="*{sundayEndTime}"
                                aria-label="日曜日の終了時間">

                                <option value="">終了</option>

                                <option
                                    th:each="t : ${timeOptions}"
                                    th:value="${t}"
                                    th:text="${t}">

                                </option>

                            </select>

                        </div>

                    </div>

                </div>

            </section>

            <!-- キャンセルと確認画面への遷移 -->
            <div class="form-actions">

                <a
                    class="button button--secondary"
                    th:href="@{/home}"
                    href="/home">

                    キャンセル

                </a>

                <button
                    class="button button--primary"
                    type="submit">

                    入力内容を確認

                    <span aria-hidden="true">→</span>

                </button>

            </div>

        </form>

    </main>

    <!-- 共通フッター -->
    <footer class="app-footer">

        © ShiftManager

    </footer>

    <script>
        /*
         * 曜日ごとの入力欄をまとめて扱うための一覧。
         *
         * 各値は DTO のフィールド名の接頭辞と一致させる。
         *
         * 例：
         * monday → mondayOff
         * monday → mondayStartTime
         * monday → mondayEndTime
         */
        const days = [
            "monday",
            "tuesday",
            "wednesday",
            "thursday",
            "friday",
            "saturday",
            "sunday"
        ];

        /*
         * 雇用形態に応じて、パート勤務用の入力欄を表示・非表示にする。
         *
         * 入力エラーや保存エラーで登録画面に戻った場合も、
         * 選択済みの employmentType に合わせて表示状態を復元する。
         */
        function togglePartTimeFields() {
            const section = document.getElementById("partTimeFields");

            const employmentType = document.getElementById(
                "employmentType"
            ).value;

            section.hidden = employmentType !== "parttime";
        }

        /*
         * 「休み」が選択された曜日の開始・終了時刻を無効化する。
         *
         * 休みに設定した場合は、勤務時間を空欄にする。
         * 休みを解除した場合は、勤務時間を再度選択できる状態にする。
         */
        function toggleWorkTime(day) {
            const offCheckbox = document.getElementById(
                `${day}Off`
            );

            const startTime = document.getElementById(
                `${day}StartTime`
            );

            const endTime = document.getElementById(
                `${day}EndTime`
            );

            const isOff = offCheckbox.checked;

            startTime.disabled = isOff;
            endTime.disabled = isOff;

            if (isOff) {
                startTime.value = "";
                endTime.value = "";
            }
        }

        /*
         * 画面表示時の初期化。
         *
         * 新規表示だけでなく、バリデーションエラーや保存失敗による
         * 再表示時にも実行される。
         *
         * ・パート勤務欄の表示状態を復元する。
         * ・各曜日の「休み」設定に応じて勤務時間欄を切り替える。
         */
        document.addEventListener("DOMContentLoaded", () => {
            togglePartTimeFields();

            days.forEach(toggleWorkTime);
        });
    </script>

</body>

</html>
