<!DOCTYPE html>

<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ユーザー登録完了</title>

    <link
        rel="stylesheet"
        th:href="@{/css/app.css}"
        href="/css/app.css">

    <link
        rel="stylesheet"
        th:href="@{/css/user.css}"
        href="/css/user.css">

</head>

<body class="app-page">

    <header class="app-header">

        <a
            class="brand brand--dark"
            th:href="@{/home}"
            href="/home"
            aria-label="ShiftManager ホーム">

            <span
                class="brand__mark"
                aria-hidden="true">

                S

            </span>

            <span>ShiftManager</span>

        </a>

        <a
            class="header-back-link"
            th:href="@{/user/list}">

            ← ユーザー一覧へ戻る

        </a>

    </header>

    <main class="content-main content-main--form">

        <section
            class="completion-card"
            th:with="
                roleKey='role.' + ${userProfileDto.role},
                genderKey='gender.' + ${userProfileDto.gender},
                employmentTypeKey='employment_type.' + ${userProfileDto.employmentType},
                departmentKey='department.' + ${userProfileDto.department},
                roleMsg=${#messages.msg(roleKey)},
                genderMsg=${#messages.msg(genderKey)},
                employmentTypeMsg=${#messages.msg(employmentTypeKey)},
                departmentMsg=${#messages.msg(departmentKey)}
            ">

            <span
                class="completion-card__icon"
                aria-hidden="true">

                ✓

            </span>

            <p class="eyebrow">REGISTRATION COMPLETED</p>

            <h1>ユーザー登録完了</h1>

            <p>
                以下の内容でユーザー登録が完了しました。
            </p>

            <div th:object="${userProfileDto}">

                <ul class="detail-list">

                    <li>

                        ユーザー名

                        <span th:text="*{username}"></span>

                    </li>

                    <li>

                        姓

                        <span th:text="*{firstName}"></span>

                    </li>

                    <li>

                        名

                        <span th:text="*{lastName}"></span>

                    </li>

                    <li>

                        姓（フリガナ）

                        <span th:text="*{firstNameKana}"></span>

                    </li>

                    <li>

                        名（フリガナ）

                        <span th:text="*{lastNameKana}"></span>

                    </li>

                    <li>

                        ユーザーロール

                        <span th:text="${roleMsg}"></span>

                    </li>

                    <li>

                        生年月日

                        <span th:text="*{birthDate}"></span>

                    </li>

                    <li>

                        性別

                        <span th:text="${genderMsg}"></span>

                    </li>

                    <li>

                        雇用形態

                        <span th:text="${employmentTypeMsg}"></span>

                    </li>

                    <li>

                        所属

                        <span th:text="${departmentMsg}"></span>

                    </li>

                </ul>

            </div>

            <div class="detail-actions">

                <a
                    class="button button--secondary"
                    th:href="@{/home}">

                    ホームへ

                </a>

                <a
                    class="button button--primary"
                    th:href="@{/user/list}">

                    ユーザー一覧へ

                </a>

            </div>

        </section>

    </main>

    <footer class="app-footer">

        © ShiftManager

    </footer>

</body>

</html>
