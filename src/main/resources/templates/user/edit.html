<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー編集</title>

    <!-- 共通デザインとユーザー管理画面のスタイルシート -->
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <link rel="stylesheet" th:href="@{/css/user.css}" href="/css/user.css">

    <style>
        /* 保存失敗時に画面上部へ表示するエラーメッセージ。 */
        .edit-error-message {
            margin: 0 0 16px;
            padding: 12px 16px;
            border: 1px solid #d32f2f;
            border-radius: 6px;
            background-color: #ffebee;
            color: #b71c1c;
        }

        /* 特定の入力項目に紐付かないフォーム全体のエラー。 */
        .edit-global-errors {
            margin: 0 0 16px;
            padding: 12px 16px;
            border: 1px solid #d32f2f;
            border-radius: 6px;
            background-color: #ffebee;
            color: #b71c1c;
        }

        .edit-global-errors ul {
            margin: 8px 0 0;
            padding-left: 20px;
        }

        .edit-global-errors li + li {
            margin-top: 4px;
        }

        /* 各入力項目のバリデーションエラーメッセージ。 */
        .error {
            display: block;
            margin-top: 4px;
            color: #c62828;
        }

        /* パート勤務スケジュールの表示間隔。 */
        .part-time-schedule {
            margin-top: 1em;
        }
    </style>
</head>

<body class="app-page">
    <!-- 共通ヘッダーとユーザー一覧への戻りリンク -->
    <header class="app-header">
        <a class="brand brand--dark" th:href="@{/home}" href="/home"
           aria-label="ShiftManager ホーム">
            <span class="brand__mark" aria-hidden="true">S</span>
            <span>ShiftManager</span>
        </a>
        <a class="header-back-link" th:href="@{/user/list}">← ユーザー一覧へ戻る</a>
    </header>

    <main class="content-main content-main--form">
        <!-- 画面タイトルと説明 -->
        <div class="page-heading">
            <div>
                <p class="eyebrow">EDIT USER</p>
                <h1>ユーザー情報の編集</h1>
                <p>登録内容を変更し、確認画面へ進んでください。</p>
            </div>
        </div>

        <section class="panel detail-panel">
            <!-- ユーザー情報の保存に失敗した場合のメッセージ -->
            <div class="edit-error-message" role="alert"
                 th:if="${errorMessage != null and !#strings.isEmpty(errorMessage)}"
                 th:text="${errorMessage}"></div>

            <!-- 編集内容を確認画面へ送信するフォーム -->
            <form class="edit-form" th:action="@{/user/edit/confirm}"
                  method="post" th:object="${user}">
                <!-- 更新対象のユーザー ID -->
                <input type="hidden" th:field="*{id}">

                <!-- 項目単位ではなくフォーム全体に対するエラー -->
                <div class="edit-global-errors" th:if="${#fields.hasGlobalErrors()}"
                     role="alert">
                    <strong>入力内容をご確認ください。</strong>
                    <ul>
                        <li th:each="error : ${#fields.globalErrors()}"
                            th:text="${error}"></li>
                    </ul>
                </div>

                <!-- ユーザー名 -->
                <div>
                    <label for="username">ユーザー名:</label>
                    <input type="text" id="username" th:field="*{username}"
                           required maxlength="100">
                    <span class="error" th:if="${#fields.hasErrors('username')}"
                          th:errors="*{username}"></span>
                </div>

                <!-- ユーザーの権限 -->
                <div>
                    <label for="role">ユーザーロール:</label>
                    <select id="role" th:field="*{role}">
                        <option value="ADMIN">管理者</option>
                        <option value="USER">一般ユーザー</option>
                    </select>
                    <span class="error" th:if="${#fields.hasErrors('role')}"
                          th:errors="*{role}"></span>
                </div>

                <!-- 姓 -->
                <div>
                    <label for="firstName">姓:</label>
                    <input type="text" id="firstName" th:field="*{firstName}"
                           required maxlength="50">
                    <span class="error" th:if="${#fields.hasErrors('firstName')}"
                          th:errors="*{firstName}"></span>
                </div>

                <!-- 名 -->
                <div>
                    <label for="lastName">名:</label>
                    <input type="text" id="lastName" th:field="*{lastName}"
                           required maxlength="50">
                    <span class="error" th:if="${#fields.hasErrors('lastName')}"
                          th:errors="*{lastName}"></span>
                </div>

                <!-- 姓のフリガナ。全角カタカナで入力する。 -->
                <div>
                    <label for="firstNameKana">姓（フリガナ）:</label>
                    <input type="text" id="firstNameKana" th:field="*{firstNameKana}"
                           placeholder="ヤマダ" required maxlength="50">
                    <span class="error" th:if="${#fields.hasErrors('firstNameKana')}"
                          th:errors="*{firstNameKana}"></span>
                </div>

                <!-- 名のフリガナ。全角カタカナで入力する。 -->
                <div>
                    <label for="lastNameKana">名（フリガナ）:</label>
                    <input type="text" id="lastNameKana" th:field="*{lastNameKana}"
                           placeholder="タロウ" required maxlength="50">
                    <span class="error" th:if="${#fields.hasErrors('lastNameKana')}"
                          th:errors="*{lastNameKana}"></span>
                </div>

                <!-- 生年月日 -->
                <div>
                    <label for="birthDate">生年月日:</label>
                    <input type="date" id="birthDate" th:field="*{birthDate}" required>
                    <span class="error" th:if="${#fields.hasErrors('birthDate')}"
                          th:errors="*{birthDate}"></span>
                </div>

                <!-- 性別 -->
                <div>
                    <label for="gender">性別:</label>
                    <select id="gender" th:field="*{gender}">
                        <option value="male">男性</option>
                        <option value="female">女性</option>
                    </select>
                    <span class="error" th:if="${#fields.hasErrors('gender')}"
                          th:errors="*{gender}"></span>
                </div>

                <!-- 雇用形態。パート選択時のみ勤務スケジュールを表示する。 -->
                <div>
                    <label for="employmentType">雇用形態:</label>
                    <select id="employmentType" th:field="*{employmentType}"
                            onchange="togglePartTimeFields()">
                        <option value="fulltime">正社員</option>
                        <option value="parttime">パート</option>
                    </select>
                    <span class="error" th:if="${#fields.hasErrors('employmentType')}"
                          th:errors="*{employmentType}"></span>
                </div>

                <!-- パート職員の曜日別固定勤務スケジュール -->
                <div id="partTimeFields" class="part-time-schedule"
                     th:style="${user.employmentType == 'parttime'} ? '' : 'display: none;'">
                    <h4>固定勤務スケジュール（曜日別勤務時間）</h4>

                    <!-- 月曜日 -->
                    <div>
                        <label for="mondayOff">月曜日:</label>
                        <input type="checkbox" id="mondayOff" th:field="*{mondayOff}"> 休み
                        <input type="time" id="mondayStartTime" th:field="*{mondayStartTime}"
                               aria-label="月曜日の開始時間"> 〜
                        <input type="time" id="mondayEndTime" th:field="*{mondayEndTime}"
                               aria-label="月曜日の終了時間">
                    </div>

                    <!-- 火曜日 -->
                    <div>
                        <label for="tuesdayOff">火曜日:</label>
                        <input type="checkbox" id="tuesdayOff" th:field="*{tuesdayOff}"> 休み
                        <input type="time" id="tuesdayStartTime" th:field="*{tuesdayStartTime}"
                               aria-label="火曜日の開始時間"> 〜
                        <input type="time" id="tuesdayEndTime" th:field="*{tuesdayEndTime}"
                               aria-label="火曜日の終了時間">
                    </div>

                    <!-- 水曜日 -->
                    <div>
                        <label for="wednesdayOff">水曜日:</label>
                        <input type="checkbox" id="wednesdayOff" th:field="*{wednesdayOff}"> 休み
                        <input type="time" id="wednesdayStartTime"
                               th:field="*{wednesdayStartTime}" aria-label="水曜日の開始時間"> 〜
                        <input type="time" id="wednesdayEndTime" th:field="*{wednesdayEndTime}"
                               aria-label="水曜日の終了時間">
                    </div>

                    <!-- 木曜日 -->
                    <div>
                        <label for="thursdayOff">木曜日:</label>
                        <input type="checkbox" id="thursdayOff" th:field="*{thursdayOff}"> 休み
                        <input type="time" id="thursdayStartTime" th:field="*{thursdayStartTime}"
                               aria-label="木曜日の開始時間"> 〜
                        <input type="time" id="thursdayEndTime" th:field="*{thursdayEndTime}"
                               aria-label="木曜日の終了時間">
                    </div>

                    <!-- 金曜日 -->
                    <div>
                        <label for="fridayOff">金曜日:</label>
                        <input type="checkbox" id="fridayOff" th:field="*{fridayOff}"> 休み
                        <input type="time" id="fridayStartTime" th:field="*{fridayStartTime}"
                               aria-label="金曜日の開始時間"> 〜
                        <input type="time" id="fridayEndTime" th:field="*{fridayEndTime}"
                               aria-label="金曜日の終了時間">
                    </div>

                    <!-- 土曜日 -->
                    <div>
                        <label for="saturdayOff">土曜日:</label>
                        <input type="checkbox" id="saturdayOff" th:field="*{saturdayOff}"> 休み
                        <input type="time" id="saturdayStartTime" th:field="*{saturdayStartTime}"
                               aria-label="土曜日の開始時間"> 〜
                        <input type="time" id="saturdayEndTime" th:field="*{saturdayEndTime}"
                               aria-label="土曜日の終了時間">
                    </div>

                    <!-- 日曜日 -->
                    <div>
                        <label for="sundayOff">日曜日:</label>
                        <input type="checkbox" id="sundayOff" th:field="*{sundayOff}"> 休み
                        <input type="time" id="sundayStartTime" th:field="*{sundayStartTime}"
                               aria-label="日曜日の開始時間"> 〜
                        <input type="time" id="sundayEndTime" th:field="*{sundayEndTime}"
                               aria-label="日曜日の終了時間">
                    </div>
                </div>

                <!-- 所属部署 -->
                <div>
                    <label for="department">所属:</label>
                    <select id="department" th:field="*{department}">
                        <option value="amami">天美</option>
                        <option value="main">本社</option>
                    </select>
                    <span class="error" th:if="${#fields.hasErrors('department')}"
                          th:errors="*{department}"></span>
                </div>

                <!-- 確認画面への送信と詳細画面への戻りリンク -->
                <div class="form-actions">
                    <button class="button button--primary" type="submit">確認</button>
                    <a class="button button--secondary"
                       th:href="@{/user/detail/{id}(id=${user.id})}">戻る</a>
                </div>
            </form>
        </section>
    </main>

    <footer class="app-footer">© ShiftManager</footer>

    <script>
        /* 雇用形態に応じて、パート勤務スケジュールの表示を切り替える。 */
        function togglePartTimeFields() {
            const selectedEmploymentType = document.getElementById("employmentType").value;
            const partTimeFields = document.getElementById("partTimeFields");
            partTimeFields.style.display = selectedEmploymentType === "parttime"
                ? "block" : "none";
        }

        /* 初回表示時と入力エラー後の再表示時に現在の雇用形態を反映する。 */
        document.addEventListener("DOMContentLoaded", togglePartTimeFields);
    </script>
</body>
</html>
