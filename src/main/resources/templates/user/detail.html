<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー詳細</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <link rel="stylesheet" th:href="@{/css/user.css}" href="/css/user.css">
</head>
<body class="app-page">
    <header class="app-header">
        <a class="brand brand--dark" th:href="@{/home}" href="/home" aria-label="ShiftManager ホーム">
            <span class="brand__mark" aria-hidden="true">S</span>
            <span>ShiftManager</span>
        </a>
        <a class="header-back-link" th:href="@{/user/list}">← ユーザー一覧へ戻る</a>
    </header>
    <main class="content-main content-main--form">
        <div class="page-heading">
            <div>
                <p class="eyebrow">USER DETAIL</p>
                <h1>ユーザー詳細</h1>
                <p>登録内容と固定勤務スケジュールを確認できます。</p>
            </div>
        </div>
        <section class="panel detail-panel" th:with="
                roleKey='role.' + ${user.role},
                genderKey='gender.' + ${user.gender},
                employmentTypeKey='employment_type.' + ${user.employmentType},
                departmentKey='department.' + ${user.department},
                roleMsg=${#messages.msg(roleKey)},
                genderMsg=${#messages.msg(genderKey)},
                employmentTypeMsg=${#messages.msg(employmentTypeKey)},
                departmentMsg=${#messages.msg(departmentKey)}
            ">
            <table class="detail-table">
                <tbody>
                    <tr><th scope="row">ユーザーID</th><td th:text="${user.id}"></td></tr>
                    <tr><th scope="row">ユーザー名</th><td th:text="${user.username}"></td></tr>
                    <tr><th scope="row">ユーザーロール</th><td th:text="${roleMsg}"></td></tr>
                    <tr><th scope="row">姓名</th><td th:text="|${user.firstName} ${user.lastName}|"></td></tr>
                    <tr><th scope="row">生年月日</th><td th:text="${user.birthDate}"></td></tr>
                    <tr><th scope="row">性別</th><td th:text="${genderMsg}"></td></tr>
                    <tr><th scope="row">雇用形態</th><td th:text="${employmentTypeMsg}"></td></tr>
                    <tr><th scope="row">所属</th><td th:text="${departmentMsg}"></td></tr>
                </tbody>
            </table>
            <div class="schedule-summary" th:if="${user.employmentType == 'parttime'}">
                <h3>固定勤務スケジュール</h3>
                    <p>月曜日<span th:text="${user.mondayOff} ? '休み' : ${user.mondayStartTime} + '〜' + ${user.mondayEndTime}"></span></p>
                    <p>火曜日<span th:text="${user.tuesdayOff} ? '休み' : ${user.tuesdayStartTime} + '〜' + ${user.tuesdayEndTime}"></span></p>
                    <p>水曜日<span th:text="${user.wednesdayOff} ? '休み' : ${user.wednesdayStartTime} + '〜' + ${user.wednesdayEndTime}"></span></p>
                    <p>木曜日<span th:text="${user.thursdayOff} ? '休み' : ${user.thursdayStartTime} + '〜' + ${user.thursdayEndTime}"></span></p>
                    <p>金曜日<span th:text="${user.fridayOff} ? '休み' : ${user.fridayStartTime} + '〜' + ${user.fridayEndTime}"></span></p>
                    <p>土曜日<span th:text="${user.saturdayOff} ? '休み' : ${user.saturdayStartTime} + '〜' + ${user.saturdayEndTime}"></span></p>
                    <p>日曜日<span th:text="${user.sundayOff} ? '休み' : ${user.sundayStartTime} + '〜' + ${user.sundayEndTime}"></span></p>
            </div>
            <div class="detail-actions">
                <a class="button button--secondary" th:href="@{/user/list}">一覧へ戻る</a>
                <a class="button button--danger" th:href="@{/user/delete/confirm/{id}(id=${user.id})}">削除する</a>
                <a class="button button--primary" th:href="@{/user/edit/{id}(id=${user.id})}">編集する</a>
            </div>
        </section>
    </main>
    <footer class="app-footer">© ShiftManager</footer>
</body>
</html>
