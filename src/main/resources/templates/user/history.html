<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー履歴 | ShiftManager</title>

    <!-- ユーザー一覧と共通のCSSを使用する。 -->
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <link rel="stylesheet" th:href="@{/css/user.css}" href="/css/user.css">

    <!-- 履歴画面固有の調整。他の画面のCSSには影響させない。 -->
    <style>
        .history-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }

        .history-page .user-name,
        .history-page .user-name-kana {
            overflow-wrap: anywhere;
        }

        .history-page .status-badge--inactive {
            color: #4f5d73;
            background: #edf0f5;
        }

        .history-page a:focus-visible,
        .history-page .table-scroll:focus-visible {
            outline: 3px solid var(--blue, #2f6fec);
            outline-offset: 3px;
        }
    </style>
</head>
<body class="app-page history-page">
    <header class="app-header">
        <a class="brand brand--dark"
           th:href="@{/home}" href="/home"
           aria-label="ShiftManager ホーム">
            <span class="brand__mark" aria-hidden="true">S</span>
            <span>ShiftManager</span>
        </a>
        <a class="header-back-link"
           th:href="@{/user/list}" href="/user/list">← ユーザー一覧へ戻る</a>
    </header>

    <main class="content-main">
        <div class="page-heading">
            <div>
                <p class="eyebrow">USER HISTORY</p>
                <h1>ユーザー履歴</h1>
                <p>無効化された職員の情報を確認できます。過去のシフトデータは保持されています。</p>
            </div>
        </div>

        <!-- 別URLへ遷移するリンクのため、JavaScriptのタブ操作は不要。 -->
        <nav class="history-nav" aria-label="ユーザー管理">
            <a class="button button--secondary button--compact"
               th:href="@{/user/list}" href="/user/list">ユーザー一覧</a>
            <a class="button button--primary button--compact"
               th:href="@{/user/history}" href="/user/history"
               aria-current="page">履歴（無効ユーザー）</a>
        </nav>

        <!--
            UserProfileViewController#showUserHistory が渡す users を表示する。
            Serviceでactive=falseのユーザーだけを取得済みであることが前提。
            DTOにactiveがなくても利用できるよう、画面側でactiveを参照しない。
            無効化日時は保存されていないため、この一覧では表示しない。
        -->
        <section class="panel" aria-labelledby="history-table-title">
            <div class="panel__header">
                <div>
                    <h2 id="history-table-title">無効化されたユーザー</h2>
                    <p>この画面では、ユーザーの再有効化や削除は行いません。</p>
                </div>
                <span class="count-badge"
                      th:text="|${users == null ? 0 : #lists.size(users)}名|">0名</span>
            </div>

            <!-- 狭い画面では横スクロール。キーボードでも操作できるようにする。 -->
            <div class="table-scroll" tabindex="0" role="region"
                 aria-labelledby="history-table-title">
                <table class="data-table">
                    <caption class="visually-hidden">無効化されたユーザーの一覧</caption>
                    <thead>
                        <tr>
                            <th scope="col">ユーザーID</th>
                            <th scope="col">氏名・フリガナ</th>
                            <th scope="col">雇用形態</th>
                            <th scope="col">所属</th>
                            <th scope="col">状態</th>
                            <th scope="col">操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td class="data-table__id" th:text="${user.id}">1</td>
                            <td>
                                <!-- このアプリではfirstName=姓、lastName=名。 -->
                                <span class="user-name"
                                      th:text="|${user.firstName ?: ''} ${user.lastName ?: ''}|">山田 太郎</span>

                                <!-- 未登録の読み仮名は表示せず、nullの文字列も出さない。 -->
                                <span class="user-name-kana"
                                      th:if="${!#strings.isEmpty(user.firstNameKana) or !#strings.isEmpty(user.lastNameKana)}"
                                      th:text="|${user.firstNameKana ?: ''} ${user.lastNameKana ?: ''}|">ヤマダ タロウ</span>
                            </td>
                            <td>
                                <!-- 既存のmessages.propertiesを利用して日本語表示する。 -->
                                <span class="status-badge"
                                      th:text="${#strings.isEmpty(user.employmentType) ? '未設定' : #messages.msg('employment_type.' + user.employmentType)}">正社員</span>
                            </td>
                            <td th:text="${#strings.isEmpty(user.department) ? '未設定' : #messages.msg('department.' + user.department)}">本社</td>
                            <td><span class="status-badge status-badge--inactive">無効</span></td>
                            <td class="data-table__action">
                                <!-- 保持されたユーザーIDで既存の詳細画面へ遷移する。 -->
                                <a class="detail-link"
                                   th:href="@{/user/detail/{id}(id=${user.id})}"
                                   th:attr="aria-label=|${user.firstName ?: ''} ${user.lastName ?: ''}の詳細を見る|">
                                    詳細を見る <span aria-hidden="true">→</span>
                                </a>
                            </td>
                        </tr>

                        <!-- 無効ユーザーが0件の場合。列数に合わせてcolspan=6とする。 -->
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td class="empty-state" colspan="6">無効化されたユーザーはいません。</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer class="app-footer">© ShiftManager</footer>
</body>
</html>
