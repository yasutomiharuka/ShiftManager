<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>システムエラーが発生しました</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <link rel="stylesheet" th:href="@{/css/user.css}" href="/css/user.css">
</head>
<body class="app-page">
    <header class="app-header">
        <a class="brand brand--dark" th:href="@{/home}" href="/home" aria-label="ShiftManager ホーム">
            <span class="brand__mark" aria-hidden="true">S</span>
            <span>ShiftManager</span>
        </a>
        <a class="header-back-link" th:href="@{/home}">← ホームへ戻る</a>
    </header>
    <main class="content-main content-main--form">
        <section class="error-card" aria-labelledby="error-title">
            <span class="error-card__code">500</span>
            <h1 id="error-title">システムエラーが発生しました</h1>
            <p>処理を正常に完了できませんでした。時間をおいて再度お試しください。</p>
            <a class="button button--primary" th:href="@{/home}">ホームへ戻る</a>
        </section>
    </main>
    <footer class="app-footer">© ShiftManager</footer>
</body>
</html>
