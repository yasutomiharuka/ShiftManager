plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

// ★ ツールチェーンは使わない（削除）
// java {
//     toolchain { languageVersion = JavaLanguageVersion.of(17) }
// }

tasks.withType(JavaCompile).configureEach {
    // IDE 向けに残してOK（release が最優先で効きます）
    sourceCompatibility = '17'
    targetCompatibility = '17'
    options.encoding = 'UTF-8'

    // ★ これが肝心：インストール済みJDK（例: 21）でも Java 17 互換のバイトコードを生成
    options.release = 17
}

// ★ ツールチェーン経由の Test ランチャーは削除
// tasks.withType(Test).configureEach {
//     javaLauncher = javaToolchains.launcherFor {
//         languageVersion = JavaLanguageVersion.of(17)
//     }
// }

tasks.named('test') {
    useJUnitPlatform()
    // テストは test プロファイル（application-test.properties）を読む
    systemProperty 'spring.profiles.active', 'test'
}

configurations {
    compileOnly { extendsFrom annotationProcessor }
}

repositories {
    maven { url 'https://maven-central.storage-download.googleapis.com/maven2' } // Google mirror
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    main { java { srcDirs = ['src/main/java'] } }
    test { java { srcDirs = ['src/test/java'] } }
}
