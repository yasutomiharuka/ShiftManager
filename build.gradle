buildscript {
    repositories {
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.springframework.boot:spring-boot-gradle-plugin:3.3.5'
        classpath 'io.spring.gradle:dependency-management-plugin:1.1.6'
    }
}

plugins {
    id 'java'
}

apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'

group = 'com.example'
version = '0.0.1-SNAPSHOT'

// ★ ツールチェーンは使わない（削除）
// java {
//     toolchain { languageVersion = JavaLanguageVersion.of(17) }
// }

tasks.withType(JavaCompile).configureEach {
    // IDE 向けに残してOK（release が最優先で効きます）
    sourceCompatibility = '17'
    targetCompatibility = '17'
    options.encoding = 'UTF-8'

    // ★ これが肝心：インストール済みJDK（例: 21）でも Java 17 互換のバイトコードを生成
    options.release = 17
}

configurations {
    compileOnly { extendsFrom annotationProcessor }
}

repositories {
    maven { url 'https://maven-central.storage-download.googleapis.com/maven2' } // Google mirror
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // 本番用
    runtimeOnly 'org.postgresql:postgresql'

    // ★ テスト用（かつローカル実行でも使えるように実行時へも載せる）
    runtimeOnly 'com.h2database:h2'
    testImplementation 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


sourceSets {
    main { java { srcDirs = ['src/main/java'] } }
    test { java { srcDirs = ['src/test/java'] } }
}

tasks.named('test') {
    useJUnitPlatform()
    // テストは test プロファイル（application-test.properties）を読む
    systemProperty 'spring.profiles.active', 'test'
}

tasks.register('runBootJar', JavaExec) {
    group = 'application'
    description = 'Builds the Spring Boot jar and runs it using the Boot loader so it can be launched from the classpath.'

    def bootJarTask = tasks.named('bootJar')
    dependsOn(bootJarTask)

    classpath = files(bootJarTask.flatMap { it.archiveFile })
    mainClass.set('org.springframework.boot.loader.launch.JarLauncher')
}
